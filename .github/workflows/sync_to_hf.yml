name: Sync to Hugging Face Hub

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Credentials and Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a secure local credential file for Hugging Face
          echo "machine huggingface.co login whitehavend password $HF_TOKEN" > ~/.netrc
          
          # Configure standard Git variables
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Link and force push directly to your Space
          git remote add hf https://huggingface.co || true
          git push --force hf main
