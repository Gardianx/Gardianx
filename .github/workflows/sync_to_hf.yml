name: Sync to Hugging Face Hub

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
         # Syncs directly to your whitehavend account space
          git push --force https://whitehavend:$HF_TOKEN@huggingface.co/spaces/whitehavend/Gardianx main
